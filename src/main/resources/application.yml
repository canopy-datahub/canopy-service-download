# DEFAULT
spring:
  mvc:
    log-request-details: false
    log-resolved-exception: false
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CANOPY_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${CANOPY_KEYCLOAK_JWK_SET_URI}
server:
  port: 8086
  servlet:
    context-path: /api/download/v1

logging:
  level:
    root: warn
    org.canopyplatform.canopy.downloadService:
      DownloadServiceApplication: info
    org.springframework.web.servlet:
      DispatcherServlet: trace
      mvc.method.annotation:
        HttpEntityMethodProcessor: info

keycloak:
  realm: ${CANOPY_KEYCLOAK_REALM}
  resource: ${CANOPY_KEYCLOAK_CLIENT_ID}

s3:
  download-directory: "workingDirectory/"
  study-uuid-spreadsheet-path: ${UuidSpreadsheetPath}

database:
  db-user: ${dbuser}
  db-password: ${password}
  host: ${host}
  port: ${port}
  db-name: ${dbname}
  db-driver-class-name: ${dbDriverClassName}

management:
  endpoint:
    health:
      enabled: true
      show-details: never
    shutdown:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,shutdown

---
# LOCAL

spring:
  jpa:
    show-sql: true
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${db_host:localhost}:${db_port:5432}/${db_name:canopy_local}
    username: ${db_username:canopy}
    password: ${db_password:canopy}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(DOWNLOAD)] [%boldGreen(LOCAL)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# DEV

spring:
  jpa:
    show-sql: true
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: dev
  security:
    user:
      name: ${CANOPY_SPRING_MANAGEMENT_USER}
      password: ${CANOPY_SPRING_MANAGEMENT_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(DOWNLOAD)] [%boldGreen(DEV)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# TEST

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: test

logging:
  pattern:
    console: "[DOWNLOAD] [TEST] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"

---
# PROD

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: prod

logging:
  pattern:
    console: "[DOWNLOAD] [PROD] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"

---
# STAGING

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: staging
  cloud.aws.region.static: us-east-1

logging:
  pattern:
    console: "[DOWNLOAD] [STAGING] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"
