# DEFAULT
spring:
  mvc:
    servlet:
      path: /api/download/v1
    log-request-details: false
    log-resolved-exception: false
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DATAHUB_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${DATAHUB_KEYCLOAK_JWK_SET_URI}

server:
  port: 8086

logging:
  level:
    root: warn
    ex.org.project.downloadService:
      DownloadServiceApplication: info
    org.springframework.web.servlet:
      DispatcherServlet: trace
      mvc.method.annotation:
        HttpEntityMethodProcessor: info

s3:
  download-directory: "workingDirectory/"
  variables-page-file-path: ${VariablesPagePath}
  variable-report-file-path: ${VariablesReportPath}
  study-uuid-spreadsheet-path: ${UuidSpreadsheetPath}

management:
  endpoint:
    health:
      enabled: true
      show-details: never
    shutdown:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,shutdown

keycloak:
  realm: ${DATAHUB_KEYCLOAK_REALM:datahub}
  resource: ${DATAHUB_KEYCLOAK_CLIENT_ID}

# RAS configuration - DEPRECATED (migrating to Keycloak)
# ras:
#   url: ${rasurl}
#   client:
#     id: ${rasclientid}
#     secret: ${rasclientsecret}

---
# LOCAL

spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/radx_local}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(DOWNLOAD)] [%boldGreen(LOCAL)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# DEV

spring:
  jpa:
    show-sql: true
  config:
    # import: aws-secretsmanager:application_dev
    activate:
      on-profile: dev
  security:
    user:
      name: ${DATAHUB_SPRING_MANAGEMENT_USER}
      password: ${DATAHUB_SPRING_MANAGEMENT_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(DOWNLOAD)] [%boldGreen(DEV)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# TEST

spring:
  config:
    import: aws-secretsmanager:application_test
    activate:
      on-profile: test

logging:
  pattern:
    console: "[DOWNLOAD] [TEST] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"

---
# PROD

spring:
  config:
    import: aws-secretsmanager:application_prod
    activate:
      on-profile: prod

logging:
  pattern:
    console: "[DOWNLOAD] [PROD] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"
