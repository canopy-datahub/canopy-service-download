# DEFAULT
spring:
  mvc:
    log-request-details: false
    log-resolved-exception: false
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DATAHUB_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${DATAHUB_KEYCLOAK_JWK_SET_URI}
server:
  port: 8080
  servlet:
    context-path: /api/download/v1

logging:
  level:
    root: warn
    ex.org.project.downloadService:
      DownloadServiceApplication: info
    org.springframework.web.servlet:
      DispatcherServlet: trace
      mvc.method.annotation:
        HttpEntityMethodProcessor: info

keycloak:
  realm: ${DATAHUB_KEYCLOAK_REALM}
  resource: ${DATAHUB_KEYCLOAK_CLIENT_ID}

s3:
  download-directory: "workingDirectory/"
  study-uuid-spreadsheet-path: ${UuidSpreadsheetPath}

management:
  endpoint:
    health:
      enabled: true
      show-details: never
    shutdown:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,shutdown

---
# LOCAL

spring:
  jpa:
    show-sql: true
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://dev-postgresql.cxew5pn6q5af.us-east-2.rds.amazonaws.com:5432/dev
    username: ${db_username}
    password: ${db_password}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(DOWNLOAD)] [%boldGreen(LOCAL)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# DEV

spring:
  jpa:
    show-sql: true
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: dev
  security:
    user:
      name: ${DATAHUB_SPRING_MANAGEMENT_USER}
      password: ${DATAHUB_SPRING_MANAGEMENT_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(DOWNLOAD)] [%boldGreen(DEV)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"

---
# TEST

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: test

logging:
  pattern:
    console: "[DOWNLOAD] [TEST] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"

---
# PROD

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: prod

logging:
  pattern:
    console: "[DOWNLOAD] [PROD] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"
